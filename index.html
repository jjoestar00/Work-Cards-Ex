

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet our Team</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
    
</head>
<body>

    <main class="container">

        <header class="page-header">
            <h1>Meet our Team</h1>

            <p>
                Lorem ipsum dolor, sit amet consectetur adipisicing elit.
                Ut aut odit, voluptates minima eius, perspiciatis a nobis
                porro fuga libero accusamus facilis vitae voluptatem tempora sunt!
                Consequuntur nesciunt beatae provident.
            </p>
        </header>

        <section id="team-container" class="team-container">
            <!-- Le card saranno generate con JavaScript -->
        </section>

        <section class="form-section">
            <h2>Aggiungi un membro</h2>

            <form id="team-form">

                <div class="form-group">
                    <label for="member-name">Nome e cognome</label>
                    <input type="text" id="member-name" required>
                </div>

                <div class="form-group">
                    <label for="member-role">Ruolo</label>
                    <input type="text" id="member-role" required>
                </div>

                <div class="form-group">
                    <label for="member-email">Email</label>
                    <input type="email" id="member-email" required>
                </div>

                <div class="form-group">
                    <label for="member-img">Percorso della foto</label>
                    <input
                        type="text"
                        id="member-img"
                        placeholder="img/male1.png"
                        required
                    >
                </div>

                <button type="submit">Aggiungi membro</button>

            </form>
        </section>

    </main>

</body>
</html>
